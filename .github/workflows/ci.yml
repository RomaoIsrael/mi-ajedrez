# Integración continua (docs/17-calidad.md): compila, pruebas unitarias (incluye Stockfish),
# comprobaciones de calidad y recorridos e2e con Playwright en cada push y pull request.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Compilación y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enlazar paquetes del monorepo (sin dependencias externas)
        run: npm install --no-audit --no-fund
      - name: Pruebas unitarias
        run: npm test
      - name: Comprobaciones de calidad (tamaño, licencias, textos)
        run: npm run check

  e2e:
    name: Recorridos e2e (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Servidor estático
        run: |
          node tools/serve.mjs 5173 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/apps/web-prototype/ > /dev/null && break; sleep 1; done
      - name: Recorridos e2e
        run: npm run test:e2e
      - name: Accesibilidad
        run: node tests/e2e/a11y.e2e.cjs
